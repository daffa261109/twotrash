<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#f4f7fa"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#668194"/></marker></defs><text x="35" y="48" font-family="Arial" font-size="29" font-weight="bold" fill="#17384b">Sinyal Pi Zero ke PCB TT-PZ2</text><text x="35" y="80" font-family="Arial" font-size="16" fill="#536b7c">Nomor BCM untuk program; nomor pin fisik untuk kabel JPI. Tidak ada Arduino Nano.</text><polyline points="365,185 490,185" fill="none" stroke="#668194" stroke-width="2.5" marker-end="url(#arrow)"/><text x="370" y="170" font-family="Arial" font-size="14" fill="#354f60">STEP / DIR / EN</text><polyline points="800,210 885,210" fill="none" stroke="#668194" stroke-width="2.5" marker-end="url(#arrow)"/><text x="803" y="194" font-family="Arial" font-size="14" fill="#354f60">logika 3V3</text><polyline points="490,420 365,420" fill="none" stroke="#668194" stroke-width="2.5" marker-end="url(#arrow)"/><text x="370" y="406" font-family="Arial" font-size="14" fill="#354f60">input home/fault</text><polyline points="885,420 800,420" fill="none" stroke="#668194" stroke-width="2.5" marker-end="url(#arrow)"/><text x="800" y="405" font-family="Arial" font-size="14" fill="#354f60">kontak / FAULT</text><polyline points="365,590 490,590" fill="none" stroke="#668194" stroke-width="2.5" marker-end="url(#arrow)"/><text x="375" y="575" font-family="Arial" font-size="14" fill="#354f60">GPIO periferal</text><polyline points="800,590 885,590" fill="none" stroke="#668194" stroke-width="2.5" marker-end="url(#arrow)"/><text x="808" y="576" font-family="Arial" font-size="14" fill="#354f60">konektor</text><rect x="35" y="125" width="330" height="530" rx="10" fill="white" stroke="#275e80" stroke-width="2"/><rect x="35" y="125" width="330" height="36" rx="10" fill="#275e80"/><text x="49" y="150" font-family="Arial" font-size="17" font-weight="bold" fill="white">Raspberry Pi / BCM</text><text x="49" y="186" font-family="Arial" font-size="15" fill="#17384b">PAN STEP 18 / DIR 12</text><text x="49" y="209" font-family="Arial" font-size="15" fill="#17384b">TILT STEP 13 / DIR 19</text><text x="49" y="232" font-family="Arial" font-size="15" fill="#17384b">ENABLE 26, LOW = aktif</text><text x="49" y="255" font-family="Arial" font-size="15" fill="#17384b">FAULT pan 20 / tilt 25</text><text x="49" y="278" font-family="Arial" font-size="15" fill="#17384b">HOME pan 6 / tilt 16</text><text x="49" y="301" font-family="Arial" font-size="15" fill="#17384b"></text><text x="49" y="324" font-family="Arial" font-size="15" fill="#17384b">I2C SDA 2 / SCL 3</text><text x="49" y="347" font-family="Arial" font-size="15" fill="#17384b">HC TRIG 17 / ECHO 27</text><text x="49" y="370" font-family="Arial" font-size="15" fill="#17384b">GPIO21 / pin40 tidak dipakai</text><text x="49" y="393" font-family="Arial" font-size="15" fill="#17384b">LED hijau 22 / merah 23</text><text x="49" y="416" font-family="Arial" font-size="15" fill="#17384b">Buzzer 5</text><text x="49" y="439" font-family="Arial" font-size="15" fill="#17384b"></text><text x="49" y="462" font-family="Arial" font-size="15" fill="#17384b">3V3 pin1, GND pin6</text><text x="49" y="485" font-family="Arial" font-size="15" fill="#17384b">Kabel IDC40 1-ke-1, 10-15 cm.</text><rect x="490" y="125" width="310" height="175" rx="10" fill="white" stroke="#976817" stroke-width="2"/><rect x="490" y="125" width="310" height="36" rx="10" fill="#976817"/><text x="504" y="150" font-family="Arial" font-size="17" font-weight="bold" fill="white">Kendali dua motor</text><text x="504" y="186" font-family="Arial" font-size="15" fill="#17384b">JARM terbuka = tidak diaktifkan.</text><text x="504" y="209" font-family="Arial" font-size="15" fill="#17384b">R_EN 2k2 menarik EN ke 3V3.</text><text x="504" y="232" font-family="Arial" font-size="15" fill="#17384b">M0/M1=0, M2=1: 1/16 step.</text><text x="504" y="255" font-family="Arial" font-size="15" fill="#17384b">RESET/SLEEP ke 3V3 Pi.</text><text x="504" y="278" font-family="Arial" font-size="15" fill="#17384b">STEP/DIR langsung: level 3V3.</text><rect x="885" y="125" width="280" height="175" rx="10" fill="white" stroke="#976817" stroke-width="2"/><rect x="885" y="125" width="280" height="36" rx="10" fill="#976817"/><text x="899" y="150" font-family="Arial" font-size="17" font-weight="bold" fill="white">DRV_PAN / DRV_TILT</text><text x="899" y="186" font-family="Arial" font-size="15" fill="#17384b">EN pojok kiri atas modul.</text><text x="899" y="209" font-family="Arial" font-size="15" fill="#17384b">VMOT pojok kanan atas.</text><text x="899" y="232" font-family="Arial" font-size="15" fill="#17384b">Header 2x8, pitch 2.54.</text><text x="899" y="255" font-family="Arial" font-size="15" fill="#17384b">Jarak dua baris 15.24 mm.</text><rect x="490" y="350" width="310" height="135" rx="10" fill="white" stroke="#275e80" stroke-width="2"/><rect x="490" y="350" width="310" height="36" rx="10" fill="#275e80"/><text x="504" y="375" font-family="Arial" font-size="17" font-weight="bold" fill="white">Home dan FAULT</text><text x="504" y="411" font-family="Arial" font-size="15" fill="#17384b">Home: COM/NC ke GND.</text><text x="504" y="434" font-family="Arial" font-size="15" fill="#17384b">R 10k pull-up + C 100nF.</text><text x="504" y="457" font-family="Arial" font-size="15" fill="#17384b">Terpicu/kabel putus = HIGH.</text><rect x="885" y="350" width="280" height="135" rx="10" fill="white" stroke="#275e80" stroke-width="2"/><rect x="885" y="350" width="280" height="36" rx="10" fill="#275e80"/><text x="899" y="375" font-family="Arial" font-size="17" font-weight="bold" fill="white">Microswitch + driver</text><text x="899" y="411" font-family="Arial" font-size="15" fill="#17384b">Dua switch home terpisah.</text><text x="899" y="434" font-family="Arial" font-size="15" fill="#17384b">FAULT per driver: LOW.</text><text x="899" y="457" font-family="Arial" font-size="15" fill="#17384b">Jangan menyatukan FAULT.</text><rect x="490" y="535" width="310" height="120" rx="10" fill="white" stroke="#247966" stroke-width="2"/><rect x="490" y="535" width="310" height="36" rx="10" fill="#247966"/><text x="504" y="560" font-family="Arial" font-size="17" font-weight="bold" fill="white">Sensor dan lampu</text><text x="504" y="596" font-family="Arial" font-size="15" fill="#17384b">ECHO: pembagi 2k2 / 2k7.</text><text x="504" y="619" font-family="Arial" font-size="15" fill="#17384b">TRIG: GPIO17 langsung 3V3.</text><text x="504" y="642" font-family="Arial" font-size="15" fill="#17384b">LED/buzzer lewat pembatas.</text><rect x="885" y="535" width="280" height="120" rx="10" fill="white" stroke="#247966" stroke-width="2"/><rect x="885" y="535" width="280" height="36" rx="10" fill="#247966"/><text x="899" y="560" font-family="Arial" font-size="17" font-weight="bold" fill="white">Periferal lama</text><text x="899" y="596" font-family="Arial" font-size="15" fill="#17384b">OLED pada 3V3.</text><text x="899" y="619" font-family="Arial" font-size="15" fill="#17384b">HC-SR04: 5V AUX.</text><text x="899" y="642" font-family="Arial" font-size="15" fill="#17384b">Buzzer aktif 2pin &lt;=50mA.</text><text x="35" y="733" font-family="Arial" font-size="15" fill="#9d5227">TT-PZ2 | Pi Zero langsung ke DRV8825 | Prototipe flap kosong | PCB tidak membawa PLN</text></svg>