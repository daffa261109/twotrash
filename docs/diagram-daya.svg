<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#f4f7fa"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#668194"/></marker></defs><text x="35" y="48" font-family="Arial" font-size="29" font-weight="bold" fill="#17384b">Daya DC terpisah, ground bersama</text><text x="35" y="80" font-family="Arial" font-size="16" fill="#536b7c">Kamera USB dan motor tidak mengambil daya dari GPIO Pi.</text><polyline points="325,195 435,195" fill="none" stroke="#668194" stroke-width="2.5" marker-end="url(#arrow)"/><text x="345" y="180" font-family="Arial" font-size="14" fill="#354f60">USB power</text><polyline points="835,195 725,195" fill="none" stroke="#668194" stroke-width="2.5" marker-end="url(#arrow)"/><text x="745" y="180" font-family="Arial" font-size="14" fill="#354f60">USB data</text><polyline points="325,390 435,390" fill="none" stroke="#668194" stroke-width="2.5" marker-end="url(#arrow)"/><text x="335" y="375" font-family="Arial" font-size="14" fill="#354f60">12V + GND</text><polyline points="725,390 835,390" fill="none" stroke="#668194" stroke-width="2.5" marker-end="url(#arrow)"/><text x="730" y="375" font-family="Arial" font-size="14" fill="#354f60">4 kabel/motor</text><polyline points="325,585 435,585" fill="none" stroke="#668194" stroke-width="2.5" marker-end="url(#arrow)"/><text x="340" y="570" font-family="Arial" font-size="14" fill="#354f60">5V + GND</text><polyline points="725,585 835,585" fill="none" stroke="#668194" stroke-width="2.5" marker-end="url(#arrow)"/><text x="735" y="570" font-family="Arial" font-size="14" fill="#354f60">konektor PCB</text><rect x="35" y="125" width="290" height="140" rx="10" fill="white" stroke="#275e80" stroke-width="2"/><rect x="35" y="125" width="290" height="36" rx="10" fill="#275e80"/><text x="49" y="150" font-family="Arial" font-size="17" font-weight="bold" fill="white">Catu Pi 5 V USB</text><text x="49" y="186" font-family="Arial" font-size="15" fill="#17384b">Ke port PWR IN Pi Zero.</text><text x="49" y="209" font-family="Arial" font-size="15" fill="#17384b">Tidak disatukan dengan 5 V AUX.</text><text x="49" y="232" font-family="Arial" font-size="15" fill="#17384b">Pakai catu/kabel yang sesuai Pi.</text><rect x="435" y="125" width="290" height="140" rx="10" fill="white" stroke="#275e80" stroke-width="2"/><rect x="435" y="125" width="290" height="36" rx="10" fill="#275e80"/><text x="449" y="150" font-family="Arial" font-size="17" font-weight="bold" fill="white">Raspberry Pi Zero</text><text x="449" y="186" font-family="Arial" font-size="15" fill="#17384b">GPIO 40 pin ke PCB: 3V3,</text><text x="449" y="209" font-family="Arial" font-size="15" fill="#17384b">GND dan sinyal saja.</text><text x="449" y="232" font-family="Arial" font-size="15" fill="#17384b">Pin 5V #2/#4 tidak dirutekan.</text><rect x="835" y="125" width="325" height="140" rx="10" fill="white" stroke="#275e80" stroke-width="2"/><rect x="835" y="125" width="325" height="36" rx="10" fill="#275e80"/><text x="849" y="150" font-family="Arial" font-size="17" font-weight="bold" fill="white">Webcam komputer USB</text><text x="849" y="186" font-family="Arial" font-size="15" fill="#17384b">Ke port USB/OTG Pi.</text><text x="849" y="209" font-family="Arial" font-size="15" fill="#17384b">Kabel USB utuh, bukan jalur etsa.</text><text x="849" y="232" font-family="Arial" font-size="15" fill="#17384b">Lensa sekitar 30 cm dari flap.</text><rect x="35" y="320" width="290" height="140" rx="10" fill="white" stroke="#976817" stroke-width="2"/><rect x="35" y="320" width="290" height="36" rx="10" fill="#976817"/><text x="49" y="345" font-family="Arial" font-size="17" font-weight="bold" fill="white">Adaptor 12 V DC / 3 A</text><text x="49" y="381" font-family="Arial" font-size="15" fill="#17384b">Sekring eksternal 2 A.</text><text x="49" y="404" font-family="Arial" font-size="15" fill="#17384b">J12V: pin1 +12V, pin2 GND.</text><text x="49" y="427" font-family="Arial" font-size="15" fill="#17384b">Jangan langsung ke lilitan motor.</text><rect x="435" y="320" width="290" height="140" rx="10" fill="white" stroke="#976817" stroke-width="2"/><rect x="435" y="320" width="290" height="36" rx="10" fill="#976817"/><text x="449" y="345" font-family="Arial" font-size="17" font-weight="bold" fill="white">Dua modul DRV8825</text><text x="449" y="381" font-family="Arial" font-size="15" fill="#17384b">VMOT 12V, input logika 3V3.</text><text x="449" y="404" font-family="Arial" font-size="15" fill="#17384b">100uF / 35V per driver.</text><text x="449" y="427" font-family="Arial" font-size="15" fill="#17384b">Heatsink + aliran udara.</text><rect x="835" y="320" width="325" height="140" rx="10" fill="white" stroke="#976817" stroke-width="2"/><rect x="835" y="320" width="325" height="36" rx="10" fill="#976817"/><text x="849" y="345" font-family="Arial" font-size="17" font-weight="bold" fill="white">Dua NEMA17 42HD4027-01</text><text x="849" y="381" font-family="Arial" font-size="15" fill="#17384b">JM: B2, B1, A1, A2.</text><text x="849" y="404" font-family="Arial" font-size="15" fill="#17384b">Pasangan lilitan diuji ohmmeter.</text><text x="849" y="427" font-family="Arial" font-size="15" fill="#17384b">Batas arus awal 1.0A; maks 1.5A.</text><rect x="35" y="515" width="290" height="140" rx="10" fill="white" stroke="#247966" stroke-width="2"/><rect x="35" y="515" width="290" height="36" rx="10" fill="#247966"/><text x="49" y="540" font-family="Arial" font-size="17" font-weight="bold" fill="white">Catu periferal 5 V / 2 A</text><text x="49" y="576" font-family="Arial" font-size="15" fill="#17384b">Sekring eksternal 1.5 A.</text><text x="49" y="599" font-family="Arial" font-size="15" fill="#17384b">J5V: pin1 +5V, pin2 GND.</text><text x="49" y="622" font-family="Arial" font-size="15" fill="#17384b">Ground terhubung GND PCB.</text><rect x="435" y="515" width="290" height="140" rx="10" fill="white" stroke="#247966" stroke-width="2"/><rect x="435" y="515" width="290" height="36" rx="10" fill="#247966"/><text x="449" y="540" font-family="Arial" font-size="17" font-weight="bold" fill="white">Bagian periferal PCB</text><text x="449" y="576" font-family="Arial" font-size="15" fill="#17384b">Buffer AHCT125 + 100nF.</text><text x="449" y="599" font-family="Arial" font-size="15" fill="#17384b">Buzzer lewat transistor.</text><text x="449" y="622" font-family="Arial" font-size="15" fill="#17384b">Ring: 1000uF / 16V.</text><rect x="835" y="515" width="325" height="140" rx="10" fill="white" stroke="#247966" stroke-width="2"/><rect x="835" y="515" width="325" height="36" rx="10" fill="#247966"/><text x="849" y="540" font-family="Arial" font-size="17" font-weight="bold" fill="white">Ring, sensor, indikator</text><text x="849" y="576" font-family="Arial" font-size="15" fill="#17384b">Ring dan HC-SR04: 5V AUX.</text><text x="849" y="599" font-family="Arial" font-size="15" fill="#17384b">OLED: 3V3 dari Pi.</text><text x="849" y="622" font-family="Arial" font-size="15" fill="#17384b">LED indikator: resistor 330R.</text><text x="35" y="733" font-family="Arial" font-size="15" fill="#9d5227">TT-PZ1 | Pi Zero langsung ke DRV8825 | Prototipe flap kosong | PCB tidak membawa PLN</text></svg>