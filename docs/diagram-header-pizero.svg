</g>
<text x="40" y="880" font-size="16" font-weight="bold" font-family="Helvetica, Arial, sans-serif" fill="#111">Yang tidak lewat header</text>
<text x="40" y="908" font-size="15" font-family="Helvetica, Arial, sans-serif" fill="#333">Merah servo ke +6,0 V catu. Cokelat servo ke GND catu, lalu GND catu disambung ke salah satu pin GND di atas.</text>
<text x="40" y="934" font-size="15" font-family="Helvetica, Arial, sans-serif" fill="#333">Pi tetap makan dari kabel USB. Rel 6 V tidak masuk ke pin 2 atau pin 4.</text>
</svg>
