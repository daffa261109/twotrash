<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="980" viewBox="0 0 1100 980">
<rect width="1100" height="980" fill="#ffffff"/>
<text x="40" y="36" font-size="22" font-weight="bold" font-family="Helvetica, Arial, sans-serif" fill="#111">Header Pi Zero, pin 1 di atas dekat kartu SD</text>
<text x="40" y="62" font-size="15" font-family="Helvetica, Arial, sans-serif" fill="#333">Susunan sama dengan pinout 40 pin. Kabel oranye servo langsung ke GPIO, tanpa resistor.</text>
